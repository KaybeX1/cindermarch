name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key
        run: base64 -d keystore/debug.keystore.b64 > keystore/debug.keystore

      - name: Build
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish release
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Cindermarch.apk
          gh release create "v0.1.${{ github.run_number }}" Cindermarch.apk \
            --title "Cindermarch 0.1.${{ github.run_number }}" \
            --notes "Automatic build of ${{ github.sha }}. Download Cindermarch.apk on your phone and open it to install." \
            --latest

      - name: Report failure
        if: failure()
        run: |
          {
            echo "Build ${{ github.run_number }} failed for commit ${{ github.sha }}."
            echo
            echo '```'
            tail -c 30000 build.log 2>/dev/null || echo "no build log was produced"
            echo '```'
          } > body.md
          gh issue create --title "Build failed (run ${{ github.run_number }})" --body-file body.md
